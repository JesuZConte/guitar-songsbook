# Publishes the static pages in /sites (privacy policy) with GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Build and deploy are separate jobs (GitHub's official layout): deploying in the same job
# as the upload can fail with "Found 0 artifact(s)" because the artifact is not listed yet.
name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ['sites/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
